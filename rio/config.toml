# Rio Terminal Configuration - V2

# --- General ---
confirm-before-quit              = false
draw-bold-text-with-light-colors = true
padding-x                        = 0
padding-y                        = [0, 0]
line-height                      = 1.0

# --- Theme & Colors ---
theme = "TokyoDark"

[shell]
  program = "/usr/bin/zsh"
  args    = ["--login"]

# Performance & Rendering
[renderer]
  performance              = "high"
  backend                  = "automatic"
  level                    = 1
  disable-unfocused-render = true

# --- Window & Appearance ---
[window]
  width       = 1920
  height      = 1080
  mode        = "maximized"
  opacity     = 1.0
  blur        = false
  decorations = "enabled"   # "Transparent" or "Buttonless" are great modern alternatives
  colorspace  = "srgb"


# --- Fonts ---
[fonts]
  size               = 19
  use-drawable-chars = true
  family             = "FiraCode Nerd Font"
  extras             = [{ family = "Hack" }]


[fonts.regular]
  family = "FiraCode Nerd Font"
  style  = "Normal"
  width  = "Normal"
  weight = 400

[fonts.bold]
  family = "FiraCode Nerd Font"
  style  = "Normal"
  width  = "Normal"
  weight = 800

[fonts.italic]
  family = "FiraCode Nerd Font"
  style  = "Italic"
  width  = "Normal"
  weight = 400

[fonts.bold-italic]
  family = "FiraCode Nerd Font"
  style  = "Italic"
  width  = "Normal"
  weight = 800

  # [fonts.emoji]
  #   family = "Noto Color Emoji"

# --- Navigation (Tabs) ---
[navigation]
  mode             = "TopTab"
  clickable        = true
  hide-if-single   = true
  use-current-path = true

# --- Cursor & Interaction ---
[cursor]
  shape             = 'block'
  blinking          = true
  blinking-interval = 800

  hide-cursor-when-typing           = false
  ignore-selection-foreground-color = false

[scroll]
  multiplier = 3.0
  divider    = 1.0

# --- Key Bindings ---
[bindings]
  keys = [
    # Basic Management
    { key = "c", with = "control|shift", action = "Copy" },
    { key = "q", with = "control|shift", action = "Quit" },
    { key = "v", with = "control|shift", action = "Paste" },

    # Font Scaling
    { key = "0", with = "control", action = "ResetFontSize" },
    { key = "minus", with = "control", action = "DecreaseFontSize" },
    { key = "plus", with = "control", action = "IncreaseFontSize" },

    # Navigation (New features for Rio)
    { key = "[", with = "control|shift", action = "SelectPrevTab" },
    { key = "t", with = "control|shift", action = "CreateTab" },
    { key = "tab", with = "control", action = "SelectNextTab" },

    # Fullscreen
    { key = "f11", with = "none", action = "ToggleFullscreen" },
  ]

[developer]
  log-level = "OFF"
