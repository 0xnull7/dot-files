# Catppuccin Mocha for Rio
# Location: ~/.config/rio/themes/catppuccin-mocha.toml

[colors]
  # Primary
  background = '#1E1E2E'
  foreground = '#CDD6F4'

  # Normal Colors
  black   = '#45475A'
  red     = '#F38BA8'
  green   = '#A6E3A1'
  yellow  = '#F9E2AF'
  blue    = '#89B4FA'
  magenta = '#F5C2E7'
  cyan    = '#94E2D5'
  white   = '#BAC2DE'

  # Light / Bright Colors
  light-black   = '#585B70'
  light-red     = '#F38BA8'
  light-green   = '#A6E3A1'
  light-yellow  = '#F9E2AF'
  light-blue    = '#89B4FA'
  light-magenta = '#F5C2E7'
  light-cyan    = '#94E2D5'
  light-white   = '#A6ADC8'

  # Dim Colors
  dim-black   = '#45475A'
  dim-red     = '#F38BA8'
  dim-green   = '#A6E3A1'
  dim-yellow  = '#F9E2AF'
  dim-blue    = '#89B4FA'
  dim-magenta = '#F5C2E7'
  dim-cyan    = '#94E2D5'
  dim-white   = '#BAC2DE'

  # Cursor & Selection
  cursor               = '#F5E0DC'
  vi-cursor            = '#B4BEFE'
  selection-background = '#F5E0DC'
  selection-foreground = '#1E1E2E'

  # Rio-Specific Navigation UI
  tabs                   = '#313244'
  tabs-active            = '#1E1E2E'
  tabs-foreground        = '#A6ADC8'
  tabs-active-foreground = '#89B4FA'
  tabs-active-highlight  = '#89B4FA'
  bar                    = '#11111B'
  split                  = '#313244'

  # Search & Hints
  search-match-background         = '#A6ADC8'
  search-match-foreground         = '#1E1E2E'
  search-focused-match-background = '#A6E3A1'
  search-focused-match-foreground = '#1E1E2E'
  hint-background                 = '#F9E2AF'
  hint-foreground                 = '#1E1E2E'
