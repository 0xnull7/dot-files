# ----------------------------------------------------------------------
# ~/.tmux.conf – V3
# ----------------------------------------------------------------------

# ============================================================================
# 1. GLOBAL SETTINGS & PERFORMANCE TUNING
# ============================================================================

# Use 256-color and truecolor (RGB) support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Optimize performance and UX
set -g history-limit 100000           # Massive scrollback
set -s escape-time 0                  # Instant response to escape sequences
set -g display-time 3000              # Status messages last 3s
set -g status-interval 5              # Refresh status bar every 5s
set -g focus-events on                # Notify when window gains/loses focus
set -g mouse on                       # Enable mouse support everywhere

# Start numbering at 1 (not 0) for windows/panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use a proper shell as default command (avoids login shell quirks)
# set -g default-command /bin/sh

# ============================================================================
# 2. KEYBINDINGS – PRODUCTIVITY FOCUSED
# ============================================================================

# Use Ctrl-a as prefix (like screen) — frees up Ctrl-b for apps like Vim
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config instantly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Smart pane splitting — preserve current working dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt + arrows (works with Vim too via plugin or config)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with Ctrl + hjkl (Vim-style)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Kill pane/window with intuitive keys
bind x kill-pane
bind X kill-window

# ============================================================================
# 3. COPY MODE – FULL VI COMPATIBILITY
# ============================================================================

setw -g mode-keys vi

# Enable modern vi-style selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'r' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ============================================================================
# 4. STATUS BAR – CLEAN, INFORMATIVE, RELIABLE
# ============================================================================

# Catppuccin Theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Right modules: show directory + session + custom dynamic status (battery + weather)
set -g @catppuccin_status_modules_right "directory session"

# Date & time (clean 12-hour format)
set -g @catppuccin_date_time_text "%Y-%m-%d %I:%M %p"
set -g status-right "#{@catppuccin_date_time_text} #( ~/.tmux/status.sh ) #{session_name}"

# Left side
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Show basename of current directory (e.g., "project" instead of "/home/user/project")
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# ============================================================================
# 5. PLUGINS – ONLY ACTIVELY MAINTAINED ONES
# ============================================================================

# Plugin Management via TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sensible defaults
set -g @plugin 'catppuccin/tmux'              # Theme
set -g @plugin 'tmux-plugins/tmux-yank'       # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # Auto-save + auto-restore

# ============================================================================
# 6. TPM INITIALIZATION – KEEP AT VERY BOTTOM
# ============================================================================

# TPM auto-loads all @plugin entries
run -b '~/.tmux/plugins/tpm/tpm'
