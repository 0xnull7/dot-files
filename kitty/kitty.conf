# --- Theme ---
include ~/.config/kitty/mocha.conf

# --- Shell ---
shell /usr/bin/zsh

# --- Window & Padding ---
# This fixes the Neovim padding issue:
# 'static' ensures the padding is constant and doesn't "jump" when Neovim opens.
window_padding_width 10
placement_strategy center
# Disabling 'resize_in_steps' makes Neovim fill the gaps perfectly.
resize_in_steps no

remember_window_size  no
initial_window_width  1000
initial_window_height 650
background_opacity 0.8
confirm_os_window_close 0

# --- Fonts ---
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
disable_ligatures cursor

# --- Performance ---
repaint_delay 8
input_delay 3
sync_to_monitor yes

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0
# Unfocused hollow effect (simulated)
cursor_beam_thickness 1.5

# --- Scrolling ---
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- Mouse ---
mouse_hide_wait 0 
copy_on_select yes
focus_follows_mouse no

# --- Key Bindings (Migrated from Alacritty) ---
# Kitty uses 'map' for bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+m minimize_window
map ctrl+plus    change_font_size all +2.0
map ctrl+minus   change_font_size all -2.0
map ctrl+0       change_font_size all 0
map f11          toggle_fullscreen
map ctrl+n       new_os_window_with_cwd

# --- Search (Kitty's built-in scrollback search) ---
map ctrl+shift+f show_scrollback

# --- Bell ---
enable_audio_bell no
